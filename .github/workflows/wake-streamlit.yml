name: Wake Streamlit demos
# Streamlit's free tier sleeps an app after ~12 h without a visitor.
# GitHub disables scheduled runs after 60 days without repo activity: re-enable under Actions if that happens.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python .github/scripts/wake_streamlit.py
